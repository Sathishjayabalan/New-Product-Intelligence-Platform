<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CapabilityOS — Product Intelligence Platform</title>
  <script>
    /* apply persisted theme before first paint to avoid a flash */
    document.documentElement.dataset.theme = localStorage.getItem("capos_theme") || "dark";
  </script>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="ws">
        <div class="ws-logo">◈</div>
        <div>
          <div class="ws-name">CapabilityOS</div>
          <div class="ws-sub" id="ws-tenant">demo</div>
        </div>
      </div>

      <nav id="nav">
        <div class="nav-group">Overview</div>
        <a href="#/dashboard" data-view="dashboard"><svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg>Dashboard</a>

        <div class="nav-group">Pipeline</div>
        <a href="#/signals" data-view="signals"><svg viewBox="0 0 16 16"><path d="M1 8h3l2-5 4 10 2-5h3" fill="none" stroke-width="1.6"/></svg>Signals</a>
        <a href="#/insights" data-view="insights"><svg viewBox="0 0 16 16"><circle cx="8" cy="6" r="4" fill="none" stroke-width="1.6"/><path d="M6 12h4M6.5 14.5h3" fill="none" stroke-width="1.6"/></svg>Insight Cards</a>
        <a href="#/behavioral" data-view="behavioral"><svg viewBox="0 0 16 16"><circle cx="4.5" cy="5" r="2.5" fill="none" stroke-width="1.6"/><circle cx="11.5" cy="11" r="2.5" fill="none" stroke-width="1.6"/><circle cx="12" cy="3.5" r="1.6" fill="none" stroke-width="1.6"/></svg>Clusters &amp; Hypotheses</a>
        <a href="#/prototype" data-view="prototype"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2" fill="none" stroke-width="1.6"/><path d="M5 6h6M5 9h6M5 12h3" fill="none" stroke-width="1.6"/></svg>Briefs &amp; Surveys</a>
        <a href="#/building" data-view="building"><svg viewBox="0 0 16 16"><path d="M2 14V7l6-4.5L14 7v7" fill="none" stroke-width="1.6"/><path d="M6 14v-4h4v4" fill="none" stroke-width="1.6"/></svg>UJMs &amp; Feature Cards</a>

        <div class="nav-group">Quality</div>
        <a href="#/evals" data-view="evals"><svg viewBox="0 0 16 16"><path d="M2 13l3.5-4 3 2.5L14 4" fill="none" stroke-width="1.6"/><circle cx="14" cy="4" r="1.4"/></svg>Eval Catalogue</a>
        <a href="#/models" data-view="models"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="6" fill="none" stroke-width="1.6"/><circle cx="8" cy="8" r="2.2"/></svg>Model Qualification</a>

        <div class="nav-group">Admin</div>
        <a href="#/settings" data-view="settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4" fill="none" stroke-width="1.6"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4" fill="none" stroke-width="1.4"/></svg>Settings</a>
        <a href="#/audit" data-view="audit"><svg viewBox="0 0 16 16"><rect x="3" y="1.5" width="10" height="13" rx="1.5" fill="none" stroke-width="1.6"/><path d="M6 5h4M6 8h4M6 11h2.5" fill="none" stroke-width="1.4"/></svg>Audit Log</a>
      </nav>

      <div class="sidebar-foot">
        <span class="badge badge-accent" id="plan-badge">starter</span>
        <span class="muted">v1.0</span>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="crumb"><span class="muted">Workspace /</span> <span id="page-title">Dashboard</span></div>
        <div class="topbar-actions">
          <label class="ctl">Tenant
            <select id="tenant-select"></select>
          </label>
          <label class="ctl">Context
            <select id="context-select"></select>
          </label>
          <button id="run-pipeline" class="btn btn-primary">
            <svg viewBox="0 0 16 16" class="btn-ic"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>Run pipeline
          </button>
          <button id="theme-toggle" class="btn btn-ghost" title="Toggle light / dark theme">
            <svg viewBox="0 0 16 16" class="btn-ic" id="theme-icon-moon"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/></svg>
            <svg viewBox="0 0 16 16" class="btn-ic" id="theme-icon-sun" style="display:none"><circle cx="8" cy="8" r="3.2"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M13 3l-1.4 1.4M4.4 11.6L3 13" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
          </button>
          <div class="avatar" title="CoE Lead">CL</div>
        </div>
      </header>
      <div id="view" class="view"></div>
    </div>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>
  <script src="/static/app.js"></script>
</body>
</html>
